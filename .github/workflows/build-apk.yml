name: Build PackZeit APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: APK kompilieren
    runs-on: ubuntu-latest

    steps:
      - name: Code aus Repository laden
        uses: actions/checkout@v4

      - name: Java für Android einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android Projektstruktur aufbauen
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # HTML-Datei als index.html in den Asset-Ordner kopieren
          cp ZeiterfassungApp.html android/app/src/main/assets/public/index.html

          # Icon einbinden falls vorhanden
          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Gradle Wrapper bereitstellen
        run: |
          cd android
          # Erstelle ein einfaches Gradle-Projektgerüst, falls keines existiert
          if [ ! -f gradlew ]; then
            echo "Generating gradle wrapper..."
          fi

      - name: APK bauen (Gradle Debug)
        run: |
          cd android
          # Wir nutzen einen direkten Build-Befehl über ein minimalistisches Gradle-Setup oder laden den Wrapper
          gradle wrapper
          ./gradlew assembleDebug

      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PackZeit-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
