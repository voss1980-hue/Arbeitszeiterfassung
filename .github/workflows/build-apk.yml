name: Build PackZeit APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: APK kompilieren
    runs-on: ubuntu-latest

    steps:
      - name: Code aus Repository laden
        uses: actions/checkout@v4

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java für Android einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: App Verzeichnis vorbereiten
        run: |
          mkdir -p www
          cp ZeiterfassungApp.html www/index.html

      - name: Capacitor installieren und initialisieren
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init PackZeit com.bjoernvoss.packzeit --web-dir www
          npx cap add android

      - name: Icon einbinden
        run: |
          if [ -f icon.png ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Gradle Build ausführen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PackZeit-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
